# Builds the preview (preview/) and publishes it to GitHub Pages
# on every push to main. The address is https://<owner>.github.io/<repo>/
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA routing: serve the app for every unknown path.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
